version: 1
services:
  - name: frontend
    sli:
      name: frontend_availability
      kind: availability
      formula: "successful_page_loads / total_page_loads"
      promql_good: "sum(rate(frontend_requests_total{status=~'2..|3..'}[5m]))"
      promql_total: "sum(rate(frontend_requests_total[5m]))"
      source: "frontend_rum.jsonl"
    slo:
      target: 0.99
      window_days: 30
    budget:
      total_events_per_month: 5142840
      allowed_failures_per_month: 51428
      downtime_minutes_equivalent: 34

  - name: api
    sli:
      name: api_availability
      kind: availability
      formula: "successful_api_requests / total_api_requests"
      promql_good: "sum(rate(api_requests_total{status=~'2..|3..'}[5m]))"
      promql_total: "sum(rate(api_requests_total[5m]))"
      source: "access_log.jsonl"
    slo:
      target: 0.999
      window_days: 30
    budget:
      total_events_per_month: 21428550
      allowed_failures_per_month: 21428
      downtime_minutes_equivalent: 14

  - name: db
    sli:
      name: db_availability
      kind: availability
      formula: "successful_db_queries / total_db_queries"
      promql_good: "sum(rate(db_queries_total{success='true'}[5m]))"
      promql_total: "sum(rate(db_queries_total[5m]))"
      source: "db_query_log.jsonl"
    slo:
      target: 0.999
      window_days: 30
    budget:
      total_events_per_month: 3428550
      allowed_failures_per_month: 3428
      downtime_minutes_equivalent: 2
